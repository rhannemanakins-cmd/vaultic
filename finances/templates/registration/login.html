{% extends 'finances/base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center; padding: 40px;">
        <h1 style="color: #2c3e50; margin-bottom: 10px;">Welcome Back</h1>
        <p style="color: #7f8c8d; margin-bottom: 30px;">Sign in to your financial command center.</p>

        <form method="post" style="text-align: left;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;">Login</button>
        </form>

        <p style="margin-top: 25px; color: #7f8c8d;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #3498db; text-decoration: none; font-weight: bold;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
