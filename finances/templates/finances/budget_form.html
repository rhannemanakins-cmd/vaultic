{% extends 'finances/base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Add New Budget Category</h2>
    <hr>
    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            {{ form.as_p }}
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Save Limit</button>
            <a href="{% url 'budgets' %}" style="padding: 10px 20px; background: #95a5a6; color: white; text-decoration: none; border-radius: 4px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
