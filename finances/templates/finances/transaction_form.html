{% extends 'finances/base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Add Transaction</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small style="color: var(--text-light);">{{ field.help_text }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Transaction</button>
    </form>
</div>
{% endblock %}
