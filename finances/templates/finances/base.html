<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TillyBudget Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. THE DESIGN SYSTEM (Midnight & Sapphire)
           ========================================== */
        :root {
            /* Brand & Accents */
            --brand-primary: #3B82F6;   /* Vibrant Sapphire Blue */
            --brand-danger: #EF4444;    /* Bright red for delete */
            --brand-success: #10B981;   /* Emerald green for success */
            
            /* Backgrounds */
            --bg-main: #0F172A;         /* Deepest midnight for main background */
            --bg-card: #1E293B;         /* Slate dark for cards & sidebar */
            
            /* Typography */
            --text-main: #F8FAFC;       /* Crisp white for readable text */
            --text-light: #94A3B8;      /* Muted blue-gray for subtitles/labels */
            
            /* UI Elements */
            --border-color: #334155;    /* Subtle dark border for tables/dividers */
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --radius: 12px;
        }

        /* ==========================================
           2. GLOBAL RESETS
           ========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh;
        }

        h1, h2, h3 { color: var(--text-main); font-weight: 700; letter-spacing: -0.5px; }

        /* ==========================================
           3. THE SIDEBAR (Navigation)
           ========================================== */
        nav { 
            width: 260px; 
            background: var(--bg-card); 
            color: var(--text-main); 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: var(--shadow-md);
            z-index: 10;
            border-right: 1px solid var(--border-color);
        }
        
        nav a { 
            color: var(--text-light); 
            display: block; 
            padding: 12px 15px; 
            text-decoration: none; 
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        
        nav a:hover { 
            background: rgba(59, 130, 246, 0.1); /* Subtle blue tint */
            color: var(--brand-primary); 
            transform: translateX(4px);
        }

        /* ==========================================
           4. MAIN CONTENT & CARDS
           ========================================== */
        main { 
            flex-grow: 1; 
            padding: 40px 60px; 
            height: 100vh;
            overflow-y: auto;
        }
        
        .card { 
            background: var(--bg-card); 
            padding: 25px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        /* ==========================================
           5. FORMS & BUTTONS (Fixed with Hover States)
           ========================================== */
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            margin-top: 4px;
            margin-bottom: 16px;
            background: var(--bg-main); 
            color: var(--text-main);    
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); 
        }

        /* Base Button Styles */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        /* The Sapphire Primary Button */
        .btn-primary { 
            background: var(--brand-primary); 
            color: white; 
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
        }
        .btn-primary:hover { 
            background: #2563EB; /* Darker sapphire on hover */
            transform: translateY(-1px);
        }

        /* The Outline Button (For CSV & Pagination) */
        .btn-outline {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: var(--border-color);
            color: white;
        }

        /* Sidebar Auth Buttons */
        .auth-section { margin-top: auto; padding-top: 25px; border-top: 1px solid var(--border-color); }
        .btn-success { background: var(--brand-success); color: white; }
        .btn-danger { background: var(--brand-danger); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger:hover { background: #DC2626; }
        .auth-btn { width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <div>
            <h2 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 0; margin-bottom: 30px; color: var(--text-main); padding-left: 10px;">
                <span style="color: var(--brand-primary);">T</span>illyBudget<span style="color: var(--brand-primary);">.</span>
            </h2>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'budgets' %}">Budgets</a>
            <a href="{% url 'debts' %}">Debt Tracker</a>
            <a href="{% url 'expenses' %}">Expenses</a>
            <a href="{% url 'income' %}">Income</a>
            <a href="{% url 'savings' %}">Savings Goals</a>
            <a href="{% url 'transaction_list' %}">Transactions</a> 
        </div>

        <div class="auth-section">
            {% if user.is_authenticated %}
                <p style="color: var(--text-light); font-size: 13px; margin-bottom: 15px; padding-left: 10px;">
                    Welcome back,<br><span style="color: var(--text-main); font-size: 16px; font-weight: 600;">{{ user.userprofile.preferred_name|default:user.username }}</span>
                </p>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="auth-btn btn-danger btn">Secure Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="auth-btn btn-primary btn">Login</a>
                <a href="{% url 'register' %}" class="auth-btn btn-success btn">Create Account</a>
            {% endif %}
        </div>
    </nav>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
